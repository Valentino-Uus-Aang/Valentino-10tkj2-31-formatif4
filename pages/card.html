<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>
    <style>
        /* 1. Universal Selector (*) - Reset global */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* 2. Descendant Selector untuk Kontainer Kartu */
        .project-card {
            background-color: #ffffff;
            max-width: 450px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        /* Pengaturan Gambar di Atas Kartu */
        .project-card .card-image {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .project-card .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        .project-card p {
            color: #555555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .project-card .tech-stack {
            font-weight: bold;
            color: #3498db;
        }

        /* Tombol Interaktif */
        .project-card .card-btn {
            display: inline-block;
            background-color: #3498db;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            transition: background-color 0.2s ease;
        }

        .project-card .card-btn:hover {
            background-color: #2980b9;
        }

        .project-card .back-link {
            display: inline-block;
            margin-top: 10px;
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .project-card .back-link:hover {
            text-decoration: underline;
        }

        /* 3. Tanda Pengenal / Watermark (Oranye Miring di Pojok Kanan Bawah Kartu) */
        .card-watermark {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 12px;
            font-style: italic;
            color: #ff8c00;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="project-card">
        <!-- Gambar di Atas Teks -->
        <div class="card-image">
            <img src="/assets/images/image.png" alt="Preview Kartu">
        </div>

        <h3>Toko Website</h3>
        <p>Ini adalah kartu yang menampilkan informasi proyek menggunakan <span class="tech-stack">CSS Internal (di dalam tag style)</span> sesuai dengan instruksi modul.</p>
        
        <div>
            <a href="#" class="card-btn">Lihat Detail</a>
            <br>
            <a href="/index.html" class="back-link">&larr; Kembali ke Beranda</a>
        </div>

        <!-- Tanda Pengenal -->
        <div class="card-watermark">Valentino Veldenson Lim</div>
    </div>

</body>
</html>
